<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&family=Rubik+Microbe&family=Rubik+Dirt&family=Rubik+Pixels&display=swap"
			rel="stylesheet"
			crossorigin="anonymous"
		/>
		<!-- Google tag (gtag.js). Not on localhost, so testing doesn't count as visits. Page views
		     after the first are SvelteKit navigations, which GA4's enhanced measurement picks up
		     from the history API; page turns in the reader are `read_page` events
		     (src/lib/analytics.ts). -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-VYMEDFZSE8"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() {
				dataLayer.push(arguments);
			}
			if (!/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
				gtag('js', new Date());
				gtag('config', 'G-VYMEDFZSE8');
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
